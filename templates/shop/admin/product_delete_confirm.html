{% extends 'shop/admin/base_admin.html' %}
{% block title %}ยืนยันการลบ{% endblock %}
{% block admin_content %}
<div class="delete-warning">
  <h2>⚠️ ยืนยันการลบสินค้า</h2>
  <p>คุณกำลังจะลบสินค้า <strong>{{ product.name }}</strong></p>
  <p class="muted">การลบไม่สามารถกู้คืนได้</p>
  <form method="post" action="{% url 'admin_product_delete' product.pk %}" class="mt-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">ยืนยันลบ</button>
    <a href="{% url 'admin_product_list' %}" class="btn btn-outline">ยกเลิก</a>
  </form>
</div>
{% endblock %}

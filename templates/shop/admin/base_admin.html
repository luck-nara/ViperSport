{% extends 'base.html' %}
{% block content %}
<div class="container admin-layout page-content">
  <aside class="admin-sidebar">
    <h3>จัดการระบบ</h3>
    <a href="{% url 'admin_dashboard' %}" class="{% if nav_admin_dashboard_active %}nav-active{% endif %}">แดชบอร์ด</a>
    <a href="{% url 'admin_product_list' %}" class="{% if nav_admin_products_active %}nav-active{% endif %}">สินค้า</a>
    <a href="{% url 'admin_category_list' %}" class="{% if nav_admin_categories_active %}nav-active{% endif %}">หมวดหมู่</a>
    <a href="{% url 'admin_order_list' %}" class="{% if nav_admin_orders_active %}nav-active{% endif %}">คำสั่งซื้อ</a>
    <a href="{% url 'admin_member_list' %}" class="{% if nav_admin_members_active %}nav-active{% endif %}">สมาชิก</a>
    <hr style="border-color:var(--border);margin:1rem 0">
    <a href="{% url 'home' %}">← กลับหน้าร้าน</a>
    <a href="{% url 'admin_logout' %}">ออกจากระบบแอดมิน</a>
  </aside>
  <section class="admin-main">
    {% block admin_content %}{% endblock %}
  </section>
</div>
{% endblock %}

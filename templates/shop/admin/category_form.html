{% extends 'shop/admin/base_admin.html' %}
{% block title %}{{ title }}{% endblock %}
{% block admin_content %}
<h1 class="section-title">{{ title }}</h1>
<form method="post" class="admin-form">
  {% csrf_token %}
  <div class="admin-form-grid">
    {% for field in form %}
    <div class="form-group{% if field.name == 'description' %} form-group--full{% endif %}">
      {{ field.label_tag }}
      {{ field }}
      {% if field.errors %}<span class="field-error">{{ field.errors.0 }}</span>{% endif %}
    </div>
    {% endfor %}
  </div>
  <div class="admin-form-actions">
    <button type="submit" class="btn">บันทึก</button>
    <a href="{% url 'admin_category_list' %}" class="btn btn-outline">ยกเลิก</a>
  </div>
</form>
{% endblock %}
